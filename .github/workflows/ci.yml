name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'bmad/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'bmad/**', '**/*.md']

env:
  HARBOR: harbor.10.0.0.200.nip.io
  HARBOR_IMAGE: library/ktayl-itsm
  GHCR_IMAGE: ghcr.io/andrelair-platform/ktayl-itsm

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute tag
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          sudo mkdir -p /etc/docker/certs.d/${{ env.HARBOR }}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /etc/docker/certs.d/${{ env.HARBOR }}/ca.crt >/dev/null
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt >/dev/null
          sudo update-ca-certificates

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.HARBOR }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      - name: Build and push (Harbor dev-tag + ghcr prod-tag)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.HARBOR }}/${{ env.HARBOR_IMAGE }}:${{ steps.meta.outputs.sha }}-amd64
            ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Flag (do NOT suppress) image vulnerabilities: print the full table AND upload SARIF to the
      # GitHub Security tab so every CVE stays visible/tracked (incl. GLPI's vendored twig). Non-blocking
      # (exit-code 0) because some are unfixable vendor CVEs — visibility over a hard block that would
      # wedge the build. No .trivyignore: nothing is hidden.
      - name: Scan image for vulnerabilities (Trivy — table, flag all)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          timeout: 15m

      - name: Trivy SARIF for code scanning
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          timeout: 15m

      - name: Upload Trivy SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the ghcr image (keyless)
        run: cosign sign --yes ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate + attach SBOM (CycloneDX)
        run: |
          syft ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }} -o cyclonedx-json=sbom.json
          cosign attach sbom --sbom sbom.json --type cyclonedx ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
